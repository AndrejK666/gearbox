[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
publish = false
license = "Apache-2.0"

# Build profiles, ported verbatim from gears-rust so a backtrace or a build
# time here means the same thing it does there.
[profile.dev]
# Incremental is for local dev cycles. CI workflows set CARGO_INCREMENTAL=0 in
# their env, which overrides this (the env var wins in both directions).
incremental = true
debug = "line-tables-only" # line tables for backtraces without full debuginfo bloat

[profile.test]
incremental = true # same rationale as [profile.dev] above
debug = "line-tables-only" # to minimize build sizes in gitworkflows

[profile.release]
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"

# Dependencies usually don't need debuginfo. See the Cargo guide:
# https://doc.rust-lang.org/cargo/guide/build-performance.html#reduce-amount-of-generated-debug-information
# When you do need it, use the `debugging` profile below.
[profile.dev.package."*"]
debug = false

# Redundant in practice -- dependencies of a test build use the dev profile, so the
# override above already covers them. Kept for symmetry with the dev/test pair.
[profile.test.package."*"]
debug = false

# Escape hatch: `cargo build --profile debugging` gives full debuginfo for the
# workspace and its dependencies. Builds into target/debugging/, safe to delete.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

# Build scripts and the proc-macro copies rustc loads during macro expansion are
# governed by build-override, not by the package overrides above.
[profile.debugging.build-override]
debug = true

[workspace.dependencies]
# Internal
gearbox-ir = { path = "crates/gearbox-ir" }
gearbox-lock = { path = "crates/gearbox-lock" }
gearbox-gdl = { path = "crates/gearbox-gdl" }
gearbox-engine = { path = "crates/gearbox-engine" }
gearbox-project = { path = "crates/gearbox-project" }
gearbox-cli = { path = "crates/gearbox-cli" }
gearbox-rpc = { path = "crates/gearbox-rpc" }

# GDL host. Exact pins: starlark is pre-1.0 and 0.14 broke hard from 0.13.
starlark = "=0.14.2"
starlark_syntax = "=0.14.2"
# The `serde_json` feature supplies `Allocative for serde_json::Value`, which the
# GDL record derive needs: a cluster provider's options are free-form JSON,
# because each plugin defines its own option schema and the SDK deliberately
# keeps that schema out of the framework. serde_json is already in the tree, so
# this adds a feature rather than a dependency.
allocative = { version = "0.3.6", features = ["serde_json"] }
# `Either` is what starlark unpacks a "this or that" argument into. Already in
# the tree through starlark, so this names it rather than adding it.
either = "1"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed access to `cargo metadata`. It still shells out -- there is no in-process
# API and the `cargo` crate is not a stable one -- but it locates cargo properly
# (explicit path, then `$CARGO`, then `PATH`) and gives `Package.manifest_path`
# and `.version`, which is exactly the table a registry source needs.
cargo_metadata = "0.23"
toml = "0.9"
schemars = "1"
ts-rs = "12"

# CLI
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"

# Rust source projection
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Filesystem
walkdir = "2"

# Generators. minijinja renders the Rust and text templates; `custom_syntax` is
# what lets the Helm templates in M7 keep `{{ }}` for Helm and use `<< >>` for
# us, so a generated chart is still a chart.
minijinja = { version = "2", features = ["custom_syntax"] }
# Note the hyphen: `serde-saphyr`, not `serde_yaml`. Pinned to the exact version
# `gears-rust` deserializes with, because the point of generating AppConfig
# through it is round-trip fidelity with the runtime's own reader -- a different
# YAML dialect that merely looks right is the failure this pin prevents.
serde-saphyr = "=0.0.22"
# Three-way merge for OperatorOwned files.
similar = "2"

# Errors / util
thiserror = "2"
heck = "0.5"
blake3 = "1"

# Test
insta = { version = "1", features = ["toml", "json"] }
proptest = "1"

# Lints, ported verbatim from gears-rust's root manifest. Kept in sync
# deliberately: code that passes review there should pass review here.
# Member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
deprecated = "warn"
non_ascii_idents = "forbid"
# DEVIATION from gears-rust, which uses "forbid". starlark's
# `ProvidesStaticType` is a `pub unsafe trait`, and its derive is required on
# every GDL host value, so `gearbox-gdl` needs a local waiver. `forbid` cannot
# be relaxed by `allow`/`expect` at all, which would force that one crate to
# opt out of this whole table and restate 111 lints locally -- guaranteeing
# drift. `deny` is the same bar (any unsafe is a hard error) while permitting
# one documented, reviewable exception, confined to `gearbox-gdl::values`.
# Every other crate remains unsafe-free; `make check` fails if that changes.
unsafe_code = "deny"
unused_mut = "warn"
noop_method_call = "warn"
unused_import_braces = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.clippy]
# See clippy rules details https://rust-lang.github.io/rust-clippy/master/index.html
# Here will be workspace global rules
pedantic = { level = "deny", priority = -1 }
async_yields_async = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
clone_on_copy = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
default_trait_access = "deny"
doc_link_with_quotes = "deny"
doc_markdown = "deny"
elidable_lifetime_names = "deny"
empty_line_after_outer_attr = "deny"
empty_structs_with_brackets = "deny"
enum_glob_use = "deny"
expect_used = "deny"
explicit_iter_loop = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
format_push_string = "deny"
if_not_else = "deny"
ignore_without_reason = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
items_after_statements = "deny"
implicit_hasher = "deny"
inefficient_to_string = "deny"
integer_division = "deny"
ip_constant = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
manual_assert = "deny"
manual_let_else = "deny"
manual_string_new = "deny"
many_single_char_names = "deny"
map_clone = "deny"
map_unwrap_or = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
missing_errors_doc = "deny"
missing_fields_in_debug = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
mutex_atomic = "deny"
needless_borrow = "deny"
needless_lifetimes = "deny"
needless_pass_by_value = "deny"
no_effect_underscore_binding = "deny"
non_ascii_literal = "deny"
non_std_lazy_statics = "deny"
option_as_ref_cloned = "deny"
redundant_closure_for_method_calls = "deny"
redundant_else = "deny"
ref_option = "deny"
regex_creation_in_loops = "deny"
return_self_not_must_use = "deny"
semicolon_if_nothing_returned = "deny"
single_char_pattern = "deny"
similar_names = "deny"
single_match_else = "deny"
struct_excessive_bools = "deny"
suspicious_operation_groupings = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "deny"
type_complexity = "deny"
unchecked_time_subtraction = "deny"
unnecessary_debug_formatting = "deny"
uninlined_format_args = "deny"
unnecessary_literal_bound = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"
unreadable_literal = "deny"
unused_async = "deny"
unused_self = "deny"
unwrap_used = "deny"
use_debug = "deny"
used_underscore_binding = "deny"
used_underscore_items = "deny"
useless_let_if_seq = "deny"
wildcard_dependencies = "deny"
wildcard_imports = "deny"

# Additional lints for LLM-generated code quality
# Catches redundant/inefficient patterns
redundant_clone = "deny"
redundant_pattern_matching = "deny"
redundant_pub_crate = "deny"
str_to_string = "deny"
manual_ok_or = "deny"
manual_map = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"

# Prevents verbose/non-idiomatic code
match_bool = "deny"
needless_for_each = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"

# Memory efficiency and correctness
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
string_lit_as_bytes = "deny"
verbose_file_reads = "deny"
