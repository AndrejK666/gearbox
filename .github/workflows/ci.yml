name: CI

# `make check` on every pull request and every push to main: fmt, clippy,
# lint, deny, the whole test suite, and the three anti-drift guards.
#
# The suite reads a real gears-rust checkout -- the golden outputs of
# products/ (crates/gearbox-engine/tests/golden_products.rs), the GDL examples,
# the error-enum corpus. Without one those tests print "skipping" and pass, so
# here gears-rust's main is checked out and GEARBOX_CORPUS_REQUIRED turns a
# missing corpus into a failure.
#
# The checkouts sit side by side, gearbox/ and gears-rust/, as they do on a
# developer's machine, so the products' `path("../../../gears-rust")` sources
# resolve here too.
#
# gears-rust's main is not pinned: Gearbox is checked against the gears people
# describe today. When gears-rust changes what a product generates, the golden
# test fails here; re-record with
# `GEARBOX_BLESS=1 cargo test -p gearbox-engine --test golden_products`
# against the commit the run logs, and review the golden diff like any other.
# The nightly run notices that drift without waiting for a Gearbox change.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GEARBOX_CORPUS_ROOT: ${{ github.workspace }}/gears-rust
      GEARBOX_CORPUS_REQUIRED: 1
      # .config/nextest.toml: report every failing test, not just the first.
      NEXTEST_PROFILE: ci
    defaults:
      run:
        shell: bash
        working-directory: gearbox
    steps:
      - uses: actions/checkout@v6
        with:
          path: gearbox
      - uses: actions/checkout@v6
        with:
          repository: constructorfabric/gears-rust
          path: gears-rust
      - name: gears-rust commit
        run: git -C ../gears-rust log -1 --format='%H %cd %s' --date=iso
      # rust-toolchain.toml names the toolchain and its rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gearbox/target
          key: check-${{ hashFiles('gearbox/rust-toolchain.toml', 'gearbox/Cargo.lock') }}
          restore-keys: check-
      - name: make check
        run: make check
